# LimSim Highway Scenario (20-30 vehicles)
ego_id: "0"
sumo_cfg: ./networkFiles/llmraft/highway/highway.sumocfg
sumo_net: ./networkFiles/llmraft/highway/highway.net.xml
sumo_rou: ./networkFiles/llmraft/highway/carlavtypes.rou.xml,networkFiles/llmraft/highway/highway.rou.xml
category: highway
vehicle_count_range: [20, 30]
designated_ratio_range: [0.3, 0.7]
max_route_edges: 0
ego_max_route_edges: 6

speed_limit_kmh: 120
following_distance_m: 30
action_noise: 0.02

scene_rules: |
  Multi-lane highway with moderate-to-heavy traffic.
  Cruise near lane speed limit when clear.
  Use lane changes for overtaking when safe.
  Avoid hard braking; prefer smooth deceleration.
  Merge carefully; check adjacent lanes before changing.
