# LimSim Intersection Scenario (20-30 vehicles)
ego_id: "0"
sumo_cfg: ./networkFiles/llmraft/intersection/intersection.sumocfg
sumo_net: ./networkFiles/llmraft/intersection/intersection.net.xml
sumo_rou: ./networkFiles/llmraft/intersection/carlavtypes.rou.xml,networkFiles/llmraft/intersection/intersection.rou.xml
category: intersection
vehicle_count_range: [20, 30]
designated_ratio_range: [0.3, 0.7]
max_route_edges: 0
ego_max_route_edges: 2

speed_limit_kmh: 50
following_distance_m: 12
action_noise: 0.02

scene_rules: |
  Urban intersection with crossing traffic. Priority junction.
  Yield to crossing traffic when entering intersection.
  Stop for red lights; slow for yellow.
  Check all directions before proceeding through junction.
  Resume normal speed after clearing the intersection.
