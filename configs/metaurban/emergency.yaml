# MetaUrban Emergency Scenario (12-18 vehicles + sudden pedestrians)
target_vehicle_range: [12, 18]
traffic_density: 0.20
spawn_human_num: 4
emergency_extra_pedestrians: 12
emergency_spawn_step_range: [80, 250]
object_density: 0.01
crswalk_density: 0.9
map_id: SXS
horizon: 1000
num_scenarios: 500
start_seed: 0

# Driving parameters
speed_limit_kmh: 45
following_distance_m: 15
yellow_light_stop_m: 25
red_light_stop_m: 35

# Control noise
action_noise: 0.03

# Scene-specific rules
scene_rules: |
  EMERGENCY: Pedestrians may appear suddenly at crosswalks.
  High crosswalk density. Be prepared for emergency braking.
  Reduce speed near crosswalk areas.
  Prioritize pedestrian safety over throughput.
  When pedestrians detected, slow immediately even if green.
